# Proves the reply streams in without a manual refresh.
#
# The bug this guards: the reducer could only update an existing row, so the
# first delta of a new turn — which always arrives before the message exists in
# history — was dropped and the chat sat silent until the user pulled to refresh.
#
# The flow sends a prompt that forces a long-ish answer, then asserts the reply
# becomes visible on its own within a few seconds, with no refresh in between.
appId: dev.opencode.mobile
name: Reply streams without refresh
---
- launchApp

- extendedWaitUntil:
    visible: "Sessions"
    timeout: 20000

# New session, default project.
- tapOn:
    point: "77%,90%"
- extendedWaitUntil:
    visible: "New session in"
    timeout: 15000
- tapOn: "Server default"
- extendedWaitUntil:
    visible: "Ask OpenCode…"
    timeout: 20000

- tapOn: "Ask OpenCode…"
- inputText: "Count slowly from one to twenty, one number per line."
- hideKeyboard
- tapOn: "Send prompt"

# The user's own message appears immediately.
- extendedWaitUntil:
    visible: "Count slowly from one to twenty, one number per line."
    timeout: 20000

# The point of the test: the agent's answer must appear without any refresh.
# A short timeout is deliberate — a manual refresh would never happen this fast,
# so passing here can only mean the stream delivered it.
- extendedWaitUntil:
    visible: "Thought process"
    timeout: 45000
    optional: true

# Wait for the turn to finish, then assert an answer exists at all. The model
# renders the numbers as digits or as words depending on the run, so asserting
# exact text made this flow flaky; what matters is that a reply arrived.
- extendedWaitUntil:
    notVisible: "Stop the agent"
    timeout: 180000

- assertNotVisible: "Working"
- assertVisible: "Thought process"
