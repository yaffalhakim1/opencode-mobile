# The question card.
#
# Run through scripts/run-question-flow.ps1, which creates a session, runs a turn,
# and injects a pending question form. A flow cannot rely on the agent calling
# `question` by asking: the model chooses, and did not call it on one run out of
# two. Injecting makes the UI deterministic while still testing the real path —
# render the card, answer it, clear it.
appId: dev.opencode.mobile
name: Question card
---
- launchApp

- extendedWaitUntil:
    visible: "OpenCode Mobile"
    timeout: 20000

# Open the prepared session by the title the harness gave it.
- scrollUntilVisible:
    element:
      text: ${SESSION_TITLE}
    direction: UP
    timeout: 30000
- tapOn: ${SESSION_TITLE}

# The card names the question and offers an answer action. The option labels are
# the server's (the agent may raise its own question rather than the injected
# one), so assert on the structure, not on specific choices.
- extendedWaitUntil:
    visible: "Next task"
    timeout: 60000
- assertVisible: "Answer"

# An option must be chosen before "Answer" becomes enabled — tapping Answer on an
# unanswered required field is a no-op, which is what made this flow fail.
- tapOn:
    point: "30%,58%"

# The card can scroll out of view while the agent keeps working, so bring it
# back before tapping.
- scrollUntilVisible:
    element:
      text: "Answer"
    direction: UP
    timeout: 20000
- tapOn: "Answer"
- extendedWaitUntil:
    notVisible: "Next task"
    timeout: 60000

# Only one card is shown at a time: a second pending form must not stack up.
# (The harness injects one, so this simply confirms none remain.)
- assertNotVisible: "Answer"

