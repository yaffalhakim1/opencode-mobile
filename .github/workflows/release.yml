name: Release

# Builds a signed APK and publishes it to the Releases page with a changelog
# generated from the commits since the previous tag.
#
# Trigger: push a tag like v1.0.0, or run it by hand from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the changelog can walk commits

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        # versionCode must increase for every upload or Android refuses the
        # install over the previous build, so it is pinned to the run number.
        run: |
          ./gradlew :app:assembleRelease --stacktrace \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/opencode-mobile-${{ steps.version.outputs.name }}.apk"

      - name: Verify the APK is signed
        run: |
          APK="out/opencode-mobile-${{ steps.version.outputs.name }}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "Using $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          {
            echo "## What changed"
            echo ""
            if [ -z "$PREVIOUS" ]; then
              git log --pretty=format:'- %s (%h)' --no-merges | head -50
            else
              echo "Changes since \`$PREVIOUS\`:"
              echo ""
              git log "$PREVIOUS..HEAD" --pretty=format:'- %s (%h)' --no-merges | head -50
            fi
            echo ""
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "adb install -r opencode-mobile-${{ steps.version.outputs.name }}.apk"
            echo '```'
            echo ""
            echo "Android 8.0 (API 26) or newer."
          } > CHANGELOG_BODY.md

          cat CHANGELOG_BODY.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          body_path: CHANGELOG_BODY.md
          files: out/opencode-mobile-${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
