name: Release

# Builds a signed APK and publishes it to the Releases page.
#
# Two triggers, equivalent for a version not yet published:
#   - push a v* tag matching version.properties (the tag is verified first)
#   - Actions -> Release -> Run workflow, no tag needed
#
# See RELEASING.md for the loop and the CHANGELOG format.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Reads the version, verifies a pushed tag agrees with it, and refuses to build
  # a version that is already published. Skipping on a repeat dispatch is
  # deliberate: re-running without a bump is a no-op, not a rebuild.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      version_code: ${{ steps.read.outputs.version_code }}
      published: ${{ steps.read.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: read
        run: |
          set -euo pipefail
          VERSION=$(grep -E '^version=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "version.properties has no version= line" >&2
            exit 1
          fi

          # A tag run must agree with the file, or the artifacts would be named
          # one thing and installed as another.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match version.properties (v$VERSION)" >&2
              exit 1
            fi
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          PUBLISHED=false
          if gh release view "v$VERSION" --json isDraft --jq '.isDraft == false' 2>/dev/null | grep -q true; then
            PUBLISHED=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "Resolved v$VERSION (versionCode $CODE), already published: $PUBLISHED"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: version
    if: needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify the APK is signed and carries the right version
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "versionCode|versionName" | head -2

          # The manifest is the number an installer actually compares, so a
          # mismatch here is the bug that silently stops updates.
          "$AAPT" dump badging "$APK" | grep -q "versionCode='${{ needs.version.outputs.version_code }}'" \
            || { echo "versionCode in the APK does not match version.properties" >&2; exit 1; }
          "$AAPT" dump badging "$APK" | grep -q "versionName='${{ needs.version.outputs.version }}'" \
            || { echo "versionName in the APK does not match version.properties" >&2; exit 1; }

      - name: Rename artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/opencode-mobile-${{ needs.version.outputs.tag }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/opencode-mobile-${{ needs.version.outputs.tag }}.apk

  # The release body is the CHANGELOG section for this version, not a commit
  # list. A missing heading fails the run rather than shipping raw commits.
  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk
          path: out

      - name: Extract changelog section
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > body.md

          if [ ! -s body.md ]; then
            echo "CHANGELOG.md has no '## [$VERSION]' section" >&2
            exit 1
          fi

          {
            cat body.md
            echo ""
            echo "## Install"
            echo ""
            echo '```sh'
            echo "adb install -r opencode-mobile-${{ needs.version.outputs.tag }}.apk"
            echo '```'
            echo ""
            echo "Android 8.0 (API 26) or newer. If an older build is installed,"
            echo "uninstall it first — the signing key must match."
          } > RELEASE_BODY.md

          cat RELEASE_BODY.md

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: out/opencode-mobile-${{ needs.version.outputs.tag }}.apk
          # A draft is never published automatically: the artifacts are checked
          # by hand first, then published from the GitHub UI.
          draft: true
          prerelease: false
